# CI for large_file_handler.
#
# This package declares six platforms and, until this file, ran its tests on
# none of them. Issue #10 — `copyAssetToLocalStorage` failing on EVERY macOS run
# — reached a user because nothing here executed. Three further defects (the
# desktop error type, a progress failure that never reached the caller's stream,
# and native unit tests that could not even construct the plugin) were found by
# running the suite per platform, not by reading the code.
#
# So the matrix is the point: a job per declared platform. A platform that is
# not exercised here is one this package only claims to support.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze + dart tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - name: Dart tests
        # The desktop implementation and the method-channel contract are pure
        # Dart, so their failure paths are covered here rather than on a device.
        run: flutter test
      - name: Analyze the example
        working-directory: example
        run: |
          flutter pub get
          flutter analyze

  macos:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: End-to-end
        working-directory: example
        run: |
          flutter pub get
          flutter test integration_test/copy_asset_test.dart -d macos
      - name: Native unit tests
        working-directory: example
        # `flutter test` rewrites FLUTTER_TARGET in Flutter-Generated.xcconfig to
        # a temp listener that no longer exists, so the Flutter Assemble phase
        # fails under xcodebuild. A plain build puts lib/main.dart back first.
        run: |
          flutter build macos --debug
          cd macos
          xcodebuild test \
            -workspace Runner.xcworkspace -scheme Runner \
            -destination 'platform=macOS' -configuration Debug \
            -parallel-testing-enabled NO

  ios:
    name: iOS
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Boot a simulator
        id: sim
        # Picked from the AVAILABLE list rather than by name: the runner image
        # decides which runtimes exist, and a device of an uninstalled runtime
        # boots into nothing while `flutter test` waits for a VM service that
        # never arrives.
        run: |
          xcrun simctl list devices available
          UDID=$(xcrun simctl list devices available \
            | awk '/^-- iOS/{ios=1;next} /^-- /{ios=0} ios && /iPhone/ && match($0, /[0-9A-F-]{36}/) {print substr($0, RSTART, RLENGTH); exit}')
          test -n "$UDID" || { echo "no available iPhone simulator"; exit 1; }
          echo "picked $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
      - name: Build once
        working-directory: example
        # Kept out of the test step so a cold build and a hung test cannot look
        # like the same 40-minute silence.
        run: |
          flutter pub get
          flutter build ios --simulator --debug
      - name: Native unit tests
        working-directory: example/ios
        # Before the end-to-end step: these are fast and deterministic, and a
        # flaky simulator run must not hide their result.
        #
        # Parallel testing clones the simulator, which fails on the runner with
        # "device was allocated but stuck in creation state".
        run: |
          xcodebuild test \
            -workspace Runner.xcworkspace -scheme Runner \
            -destination 'platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}' \
            -configuration Debug -parallel-testing-enabled NO
      - name: Simulator visible to Flutter?
        # Fails in seconds with the device list printed, instead of letting the
        # next step wait out the job timeout.
        run: |
          flutter devices
          flutter devices | grep -q '${{ steps.sim.outputs.udid }}' || {
            echo "the booted simulator is not visible to Flutter"; exit 1; }
      - name: End-to-end
        working-directory: example
        run: flutter test integration_test/copy_asset_test.dart -d ${{ steps.sim.outputs.udid }}

  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Kotlin unit tests
        working-directory: example
        # These need `unitTests.returnDefaultValues`: the plugin holds a
        # `Handler(Looper.getMainLooper())` field, so without it CONSTRUCTING it
        # throws "not mocked" and no Android unit test can run at all.
        run: |
          flutter pub get
          # settings.gradle asserts on `flutter.sdk` in local.properties, which
          # the Flutter tool writes and `pub get` does not. --config-only
          # produces it without building an APK.
          flutter build apk --config-only
          cd android
          # Flutter's example template gitignores the Gradle wrapper, so a fresh
          # checkout has no ./gradlew. `gradle wrapper` is not a way out: it
          # configures the project with the runner's Gradle (9.x) first, and AGP
          # 8.x cannot load there. Fetch the distribution this project pins and
          # run that. The version is READ from the wrapper properties rather
          # than repeated here, so the two cannot drift apart.
          # `#` as the delimiter, not `|`: the alternation below contains one.
          GRADLE_VERSION=$(sed -nE 's#.*/gradle-([0-9.]+)-(all|bin)\.zip#\1#p' \
            gradle/wrapper/gradle-wrapper.properties)
          test -n "$GRADLE_VERSION" || {
            echo "could not read the pinned Gradle version"; exit 1; }
          echo "pinned gradle: $GRADLE_VERSION"
          curl -sSLo /tmp/gradle.zip \
            "https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip"
          unzip -q /tmp/gradle.zip -d /tmp
          "/tmp/gradle-$GRADLE_VERSION/bin/gradle" testDebugUnitTest
      - name: End-to-end on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          working-directory: example
          script: flutter test integration_test/copy_asset_test.dart -d emulator-5554

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: End-to-end
        working-directory: example
        run: |
          flutter pub get
          flutter test integration_test/copy_asset_test.dart -d windows

  linux:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev xvfb
      - name: End-to-end
        working-directory: example
        # The runner is headless; the Linux shell still needs a display server.
        run: |
          flutter pub get
          xvfb-run -a flutter test integration_test/copy_asset_test.dart -d linux

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      # Matches chromedriver to the Chrome already on the runner. Installing
      # our own Chrome does not work: with `--browser-name=chrome` it is
      # CHROMEDRIVER that launches the browser, from its own default path, so
      # CHROME_EXECUTABLE is ignored and the majors diverge again.
      - uses: nanasess/setup-chromedriver@v2
      - name: End-to-end
        working-directory: example
        run: |
          flutter pub get
          # Printed so a future version drift names itself in the log instead of
          # surfacing as SessionNotCreatedException.
          google-chrome --version
          chromedriver --version
          chromedriver --port=4444 &
          sleep 3
          flutter drive \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/copy_asset_web_test.dart \
            -d web-server --browser-name=chrome --headless
